<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#ffffff"/>
<text x="90" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2937" text-anchor="start" font-weight="bold" >One grain: request, search, splice, fade</text><text x="90" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >The tap’s delay against time. 404 ticks before it reaches an edge the search starts; at the edge a second tap is seated at the other end,</text><text x="90" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >offset by the best lag, and faded in. A keeps walking until the fade is done (dashed), then B is the live tap and the cycle repeats.</text><text x="90" y="120" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" >Octave down: step = +0.5, one grain is 2048 ticks</text><line x1="90" y1="337.1" x2="1130" y2="337.1" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="82" y="342.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >436</text><line x1="90" y1="183.5" x2="1130" y2="183.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="82" y="188.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >1460</text><text x="82" y="359.1" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"  >near</text><text x="82" y="171.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"  >far</text><line x1="90" y1="380" x2="1130" y2="380" stroke="#6b7280" stroke-width="1" /><line x1="90" y1="140" x2="90" y2="380" stroke="#6b7280" stroke-width="1" /><text x="1130" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >time, ticks →</text><text x="30" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >delay</text><rect x="756.8330733229329" y="140" width="163.86895475819028" height="240" fill="#fde68a" opacity="0.55"/><rect x="920.7020280811232" y="140" width="103.8377535101406" height="240" fill="#fed7aa" opacity="0.7"/><line x1="90" y1="337.1" x2="920.7020280811232" y2="183.5" stroke="#2563eb" stroke-width="3" /><line x1="920.7020280811232" y1="183.5" x2="1024.5397815912638" y2="164.3" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/><line x1="920.7020280811232" y1="325.1" x2="1130" y2="286.4" stroke="#ea580c" stroke-width="3" /><circle cx="756.8330733229329" cy="213.8" r="5" fill="#1f2937"/><text x="756.8330733229329" y="201.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >request</text><circle cx="920.7020280811232" cy="183.5" r="5" fill="#1f2937"/><text x="920.7020280811232" y="169.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >splice</text><text x="838.7675507020281" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle"  >search, 404 ticks</text><text x="972.6209048361935" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle"  >fade, 256 ticks</text><line x1="934.7020280811232" y1="337.1" x2="934.7020280811232" y2="325.1" stroke="#ea580c" stroke-width="1.5" /><line x1="930.7020280811232" y1="337.1" x2="938.7020280811232" y2="337.1" stroke="#ea580c" stroke-width="1.5" /><line x1="930.7020280811232" y1="325.1" x2="938.7020280811232" y2="325.1" stroke="#ea580c" stroke-width="1.5" /><text x="944.7020280811232" y="355.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start"  >B seated at 436 + best lag</text><line x1="710" y1="116" x2="740" y2="116" stroke="#2563eb" stroke-width="3" /><text x="746" y="121" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >tap A (live)</text><line x1="850" y1="116" x2="880" y2="116" stroke="#ea580c" stroke-width="3" /><text x="886" y="121" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >tap B (fading in, then becomes A)</text><text x="260.3588143525741" y="333.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start"  >A walks the excursion at step per tick</text><text x="1126" y="274.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="end"  >B is now the live tap</text><text x="90" y="460" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" >Octave up: step = −1, one grain is 1024 ticks</text><line x1="90" y1="677.1" x2="1130" y2="677.1" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="82" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >436</text><line x1="90" y1="523.5" x2="1130" y2="523.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="82" y="528.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >1460</text><text x="82" y="699.1" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"  >near</text><text x="82" y="511.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end"  >far</text><line x1="90" y1="720" x2="1130" y2="720" stroke="#6b7280" stroke-width="1" /><line x1="90" y1="480" x2="90" y2="720" stroke="#6b7280" stroke-width="1" /><text x="1130" y="738" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >time, ticks →</text><text x="30" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >delay</text><rect x="508.7012987012987" y="480" width="272.83116883116884" height="240" fill="#fde68a" opacity="0.55"/><rect x="781.5324675324675" y="480" width="172.88311688311683" height="240" fill="#fed7aa" opacity="0.7"/><line x1="90" y1="523.5" x2="781.5324675324675" y2="677.1" stroke="#2563eb" stroke-width="3" /><line x1="781.5324675324675" y1="677.1" x2="954.4155844155844" y2="715.5" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/><line x1="781.5324675324675" y1="511.5" x2="1130" y2="588.9" stroke="#ea580c" stroke-width="3" /><circle cx="508.7012987012987" cy="616.5" r="5" fill="#1f2937"/><text x="508.7012987012987" y="640.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >request</text><circle cx="781.5324675324675" cy="677.1" r="5" fill="#1f2937"/><text x="781.5324675324675" y="703.1" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" >splice</text><text x="645.1168831168832" y="710" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle"  >search, 404 ticks</text><text x="867.974025974026" y="630" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle"  >fade, 256 ticks</text><line x1="795.5324675324675" y1="523.5" x2="795.5324675324675" y2="511.5" stroke="#ea580c" stroke-width="1.5" /><line x1="791.5324675324675" y1="523.5" x2="799.5324675324675" y2="523.5" stroke="#ea580c" stroke-width="1.5" /><line x1="791.5324675324675" y1="511.5" x2="799.5324675324675" y2="511.5" stroke="#ea580c" stroke-width="1.5" /><text x="805.5324675324675" y="495.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start"  >B seated at 1460 − best lag</text><line x1="710" y1="456" x2="740" y2="456" stroke="#2563eb" stroke-width="3" /><text x="746" y="461" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >tap A (live)</text><line x1="850" y1="456" x2="880" y2="456" stroke="#ea580c" stroke-width="3" /><text x="886" y="461" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >tap B (fading in, then becomes A)</text><text x="373.6363636363636" y="572.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start"  >A walks the excursion at step per tick</text><text x="1126" y="614.9" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="end"  >B is now the live tap</text>
</svg>
