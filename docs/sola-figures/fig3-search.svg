<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
<rect width="1200" height="790" fill="#ffffff"/>
<text x="60" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2937" text-anchor="start" font-weight="bold" >The search: one lag per tick</text><text x="60" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >The near window is frozen into MR0..MR99 at the request. The far window is read at fixed addresses every tick, so the drift of the delay line sweeps the lag.</text><text x="60" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >Request (tick 0)</text><text x="480" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >capture the near window; countdown = 404</text><rect x="60" y="120" width="1080" height="30" fill="#d9dde3" /><rect x="289.921875" y="120" width="540" height="30" fill="#eef2f7" stroke="#6b7280" stroke-width="1"/><rect x="77.40234375" y="124" width="210.9375" height="22" fill="#16a34a" opacity="0.85"/><rect x="617.40234375" y="124" width="210.9375" height="22" fill="#16a34a" opacity="0.35"/><rect x="723.3984375" y="117" width="210.9375" height="36" fill="none" stroke="#7c3aed" stroke-width="2.5"/><rect x="77.40234375" y="117" width="210.9375" height="36" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="182.87109375" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >near window, delay 33..429, copied to MR0..99</text><text x="828.8671875" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle"  >far window read, delay 1258..1654 (fixed)</text><text x="289.921875" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"  >436</text><text x="829.921875" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"  >1460</text><text x="60" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >Tick 1: lag −200</text><text x="480" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >100 MACs: MR0..99 × the far window</text><rect x="60" y="240" width="1080" height="30" fill="#d9dde3" /><rect x="289.921875" y="240" width="540" height="30" fill="#eef2f7" stroke="#6b7280" stroke-width="1"/><rect x="77.9296875" y="244" width="210.9375" height="22" fill="#16a34a" opacity="0.85"/><rect x="617.9296875" y="244" width="210.9375" height="22" fill="#16a34a" opacity="0.35"/><rect x="723.3984375" y="237" width="210.9375" height="36" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="183.3984375" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the captured content, drifted</text><text x="723.3984375" y="308" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the same content, 1024 older: lag -200</text><line x1="617.9296875" y1="282" x2="723.3984375" y2="282" stroke="#7c3aed" stroke-width="1.5" /><polygon points="723.3984375,282 715.2944135788259,285.9146898070011 715.2944135788259,278.0853101929989" fill="#7c3aed"/><text x="60" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >Tick 201: lag 0</text><text x="480" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >the nominal splice, 1024 samples apart</text><rect x="60" y="360" width="1080" height="30" fill="#d9dde3" /><rect x="289.921875" y="360" width="540" height="30" fill="#eef2f7" stroke="#6b7280" stroke-width="1"/><rect x="183.3984375" y="364" width="210.9375" height="22" fill="#16a34a" opacity="0.85"/><rect x="723.3984375" y="364" width="210.9375" height="22" fill="#16a34a" opacity="0.35"/><rect x="723.3984375" y="357" width="210.9375" height="36" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="288.8671875" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the captured content, drifted</text><text x="828.8671875" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the same content, 1024 older: lag 0</text><text x="60" y="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >Tick 401: lag +200</text><text x="480" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >all 401 lags scored; best is in MR101</text><rect x="60" y="480" width="1080" height="30" fill="#d9dde3" /><rect x="289.921875" y="480" width="540" height="30" fill="#eef2f7" stroke="#6b7280" stroke-width="1"/><rect x="288.8671875" y="484" width="210.9375" height="22" fill="#16a34a" opacity="0.85"/><rect x="828.8671875" y="484" width="210.9375" height="22" fill="#16a34a" opacity="0.35"/><rect x="723.3984375" y="477" width="210.9375" height="36" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="394.3359375" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the captured content, drifted</text><text x="934.3359375" y="548" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the same content, 1024 older: lag +200</text><line x1="828.8671875" y1="522" x2="723.3984375" y2="522" stroke="#7c3aed" stroke-width="1.5" /><polygon points="723.3984375,522 731.5024614211741,518.0853101929989 731.5024614211741,525.9146898070011" fill="#7c3aed"/><text x="60" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >Tick 404: splice (octave down)</text><text x="480" y="680" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >B is placed where the best lag said the signal matches what A is reading</text><rect x="60" y="610" width="1080" height="30" fill="#d9dde3" /><rect x="289.921875" y="610" width="540" height="30" fill="#eef2f7" stroke="#6b7280" stroke-width="1"/><rect x="290.44921875" y="614" width="210.9375" height="22" fill="#16a34a" opacity="0.85"/><rect x="830.44921875" y="614" width="210.9375" height="22" fill="#16a34a" opacity="0.35"/><rect x="723.3984375" y="607" width="210.9375" height="36" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="395.91796875" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle"  >the captured content, now under the near edge</text><line x1="829.921875" y1="584" x2="829.921875" y2="606" stroke="#2563eb" stroke-width="2.5" /><polygon points="829.921875,606 826.0071851929989,597.8959760788259 833.8365648070011,597.8959760788259" fill="#2563eb"/><text x="837.921875" y="598" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" >tap A at the far edge</text><line x1="332.109375" y1="584" x2="332.109375" y2="606" stroke="#ea580c" stroke-width="2.5" /><polygon points="332.109375,606 328.1946851929989,597.8959760788259 336.0240648070011,597.8959760788259" fill="#ea580c"/><text x="340.109375" y="598" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start" font-weight="bold" >tap B seated at 436 + best lag</text><rect x="60" y="720" width="22" height="14" fill="#16a34a" opacity="0.85"/><text x="90" y="732" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >the near window’s content, drifting one sample per tick</text><rect x="530" y="720" width="22" height="14" fill="#16a34a" opacity="0.35"/><text x="560" y="732" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >the same content, one grain (1024 samples) older</text><rect x="920" y="720" width="22" height="14" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="950" y="732" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="start"  >far window read addresses</text><text x="60" y="760" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >The lag is how far the older copy sits from the fixed read box. Nothing moves the box; the delay line moves the signal.</text>
</svg>
