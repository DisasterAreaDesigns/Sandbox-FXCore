<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<rect width="1200" height="420" fill="#ffffff"/>
<text x="80" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2937" text-anchor="start" font-weight="bold" >The delay line and the tap</text><text x="80" y="66" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start"  >Delay 0 is where this tick’s input is written. Every tick, everything in the line is one sample older, so its contents drift to the right.</text><rect x="80" y="150" width="1040" height="36" fill="#d9dde3" /><rect x="301.40625" y="150" width="520" height="36" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><line x1="80" y1="186" x2="80" y2="194" stroke="#6b7280" stroke-width="1.5" /><text x="80" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"  >0</text><line x1="301.40625" y1="186" x2="301.40625" y2="194" stroke="#6b7280" stroke-width="1.5" /><text x="301.40625" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"  >436</text><line x1="821.40625" y1="186" x2="821.40625" y2="194" stroke="#6b7280" stroke-width="1.5" /><text x="821.40625" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"  >1460</text><line x1="1120" y1="186" x2="1120" y2="194" stroke="#6b7280" stroke-width="1.5" /><text x="1120" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"  >2048</text><text x="84" y="138" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >input written here</text><text x="301.40625" y="138" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" >near edge</text><text x="821.40625" y="138" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" >far edge</text><text x="561.40625" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle"  >the tap’s 1024-sample excursion</text><text x="912.5" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >delay, samples →</text><line x1="110.46875" y1="168" x2="283.125" y2="168" stroke="#6b7280" stroke-width="1.5" /><polygon points="283.125,168 275.0209760788259,171.91468980700108 275.0209760788259,164.08531019299892" fill="#6b7280"/><text x="110.46875" y="173" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" text-anchor="start"  ></text><text x="196.796875" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"  >contents drift, 1 sample / tick</text><line x1="561.40625" y1="281" x2="561.40625" y2="190" stroke="#2563eb" stroke-width="3" /><polygon points="561.40625,190 565.3209398070011,198.1040239211741 557.4915601929989,198.1040239211741" fill="#2563eb"/><text x="561.40625" y="301" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold" >tap, starts at 948</text><line x1="577.40625" y1="320" x2="815.40625" y2="320" stroke="#2563eb" stroke-width="2.5" /><polygon points="815.40625,320 807.3022260788259,323.9146898070011 807.3022260788259,316.0853101929989" fill="#2563eb"/><text x="833.40625" y="325" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" >octave down</text><text x="833.40625" y="344" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >step = +0.5 / tick: delay grows,</text><text x="833.40625" y="361" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"  >the tap reads at half speed</text><line x1="545.40625" y1="320" x2="307.40625" y2="320" stroke="#2563eb" stroke-width="2.5" /><polygon points="307.40625,320 315.5102739211741,316.0853101929989 315.5102739211741,323.9146898070011" fill="#2563eb"/><text x="289.40625" y="325" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="end" font-weight="bold" >octave up</text><text x="289.40625" y="344" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >step = −1 / tick: delay shrinks,</text><text x="289.40625" y="361" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"  >the tap reads at double speed</text><text x="80" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start"  >step = 1 − ratio.  At unity step = 0 and the tap sits still: no splices at all.</text>
</svg>
